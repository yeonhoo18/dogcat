<head>

  <style>
    :root {
      --navy:    #1A2A6C;
      --navy-d:  #111D50;
      --navy-l:  #2A3F9A;
      --yellow:  #FFD600;
      --yellow-d:#E6BE00;
      --yellow-l:#FFE54D;
      --bg:      #F4F6FF;
      --sf:      #FFFFFF;
      --tm:      #1A2A6C;
      --ts:      #4A5568;
      --th:      #8A95B0;
      --br:      #C8D0F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    .wrap { width: 100%; max-width: 480px; min-height: 100vh; background: var(--sf); box-shadow: 0 0 60px rgba(26,42,108,.12); display: flex; flex-direction: column; }

    /* HEADER */
    .hdr { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-l) 100%); padding: 32px 24px 28px; text-align: center; position: relative; overflow: hidden; }
    .hdr::before { content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,214,0,.10); }
    .hdr::after  { content:''; position:absolute; bottom:-60px; left:-30px; width:200px; height:200px; border-radius:50%; background:rgba(255,214,0,.06); }
    .hdr-em { display:block; margin-bottom:8px; }
    .hdr-logo { height:90px; width:auto; filter:drop-shadow(0 4px 12px rgba(0,0,0,.35)); border-radius:12px; }
    .hdr h1 { font-size:1.4rem; font-weight:900; color:var(--yellow); letter-spacing:-.5px; position:relative; z-index:1; }
    .hdr p  { font-size:.82rem; color:rgba(255,255,255,.75); margin-top:6px; position:relative; z-index:1; }

    /* PROGRESS */
    .pw { padding:16px 24px 0; }
    .pl { display:flex; justify-content:space-between; font-size:.75rem; color:var(--th); margin-bottom:8px; font-weight:500; }
    .pt { height:8px; background:#D8DEFC; border-radius:99px; overflow:hidden; }
    .pf { height:100%; background:linear-gradient(90deg, var(--navy), var(--yellow)); border-radius:99px; transition:width .4s cubic-bezier(.4,0,.2,1); width:0%; }
    .dots { display:flex; justify-content:center; gap:8px; margin-top:12px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#C7CFEE; transition:all .3s ease; }
    .dot.active { background:var(--navy); transform:scale(1.2); }
    .dot.done   { background:var(--yellow-d); }

    /* NAV BAR */
    .nav-bar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px 0; min-height:44px; }
    .nav-back {
      display:flex; align-items:center; gap:5px;
      background:none; border:2px solid var(--br); border-radius:10px;
      padding:7px 14px; font-size:.82rem; font-weight:700; color:var(--navy);
      cursor:pointer; font-family:inherit; transition:all .2s;
      -webkit-appearance:none; appearance:none; outline:none;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-back:hover:not(:disabled) { border-color:var(--navy); background:#EFF1FF; }
    .nav-back:disabled { opacity:.28; cursor:default; pointer-events:none; }
    .nav-step-info { font-size:.76rem; color:var(--th); font-weight:500; }

    /* CONTENT */
    .cont { padding:24px 20px 32px; flex-grow:1; }

    /* QUESTION */
    .qh { text-align:center; margin-bottom:24px; }
    .qb { display:inline-block; background:linear-gradient(135deg, var(--navy), var(--navy-l)); color:var(--yellow); font-size:.7rem; font-weight:700; padding:4px 12px; border-radius:99px; margin-bottom:12px; letter-spacing:1px; }
    .qt { font-size:1.3rem; font-weight:900; color:var(--tm); line-height:1.4; letter-spacing:-.5px; }
    .qs { font-size:.82rem; color:var(--ts); margin-top:6px; }

    /* OPTIONS */
    .og  { display:flex; flex-direction:column; gap:12px; }
    .og.tc { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .ob {
      background: var(--sf);
      border: 2px solid var(--br);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--tm);
      cursor: pointer;
      transition: border-color .22s, transform .22s, box-shadow .22s, background .22s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      /* Prevent iOS Safari button autostyling */
      -webkit-text-fill-color: var(--tm);

    .og.tc .ob { flex-direction:column; align-items:center; text-align:center; gap:8px; padding:18px 12px; }

    .og.tc .oa { display:none; }

    .ol { display:block; font-size:1rem; font-weight:700; -webkit-text-fill-color: inherit; }
    .oh { display:block; font-size:.75rem; font-weight:400; color:#6B7280; margin-top:2px; -webkit-text-fill-color: #6B7280; }
    .oa { color:#9CA3AF; font-size:1.1rem; }

    .ob.selected {
      background:linear-gradient(135deg, var(--navy), var(--navy-l)) !important;
      border-color:var(--navy) !important;
      -webkit-text-fill-color: #fff !important;
      color:#fff !important;

    .ob.selected .oh { -webkit-text-fill-color: rgba(255,255,255,.75) !important; color:rgba(255,255,255,.75) !important; }

    .rh  { text-align:center; margin-bottom:20px; }
    .rem { font-size:3rem; display:block; margin-bottom:10px; }
    .rt  { font-size:1.4rem; font-weight:900; color:var(--tm); letter-spacing:-.5px; }
    .rs  { font-size:.85rem; color:var(--ts); margin-top:6px; line-height:1.5; }
    .rtg { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
    .rtag { background:#EFF1FF; color:var(--navy); font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:99px; border:1px solid var(--br); }
    .pl2 { display:flex; flex-direction:column; gap:16px; }
    .pc  { background:linear-gradient(135deg,#F8F9FF 0%,#EFF1FF 100%); border:1.5px solid var(--br); border-radius:20px; padding:20px; position:relative; overflow:hidden; transition:transform .2s,box-shadow .2s; animation:fu .4s ease both; }
    .pc:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(26,42,108,.15); }
    .pc:nth-child(1){ animation-delay:.05s; }
    .pc:nth-child(2){ animation-delay:.15s; }
    .pc:nth-child(3){ animation-delay:.25s; }
    @keyframes fu { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .prk { position:absolute; top:16px; right:16px; font-size:1.5rem; }
    .pb  { font-size:.72rem; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
    .pn  { font-size:1.05rem; font-weight:900; color:var(--tm); letter-spacing:-.3px; line-height:1.3; margin-bottom:8px; padding-right:44px; }
    .pbg { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
    .badge { font-size:.68rem; font-weight:700; padding:3px 8px; border-radius:6px; }
    .ba { background:#EDE9FE; color:#7C3AED; }
    .bh { background:#D1FAE5; color:#065F46; }
    .bd { background:#FEF3C7; color:#92400E; }
    .bt { background:#DBEAFE; color:#1E40AF; }
    .bs { background:#FCE7F3; color:#9D174D; }
    .pdesc { font-size:.85rem; color:#6B7280; line-height:1.6; border-top:1px solid var(--br); padding-top:10px; margin-top:6px; }
    .nr  { text-align:center; padding:32px 20px; background:#EFF1FF; border-radius:20px; border:1.5px dashed var(--br); }
    .nre { font-size:3rem; display:block; margin-bottom:12px; }
    .nr p { font-size:.9rem; color:#6B7280; line-height:1.6; }
    .acts { margin-top:24px; }
    .rbtn {
      background:linear-gradient(135deg, var(--navy), var(--navy-l));
      color:var(--yellow); border:none; padding:16px; width:100%;

      -webkit-appearance:none; appearance:none;
      -webkit-text-fill-color: var(--yellow);
    }
    .rbtn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(26,42,108,.40); }
    .sn  { text-align:center; font-size:.78rem; color:#9CA3AF; padding:12px 20px 20px; line-height:1.5; }
    .sn strong { color:var(--navy); }
    .sf  { animation:sf .3s ease; }
    @keyframes sf { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:translateX(0)} }
  </style>
</head>

var STEPS=[
  {k:"age",q:"아이의 연령대는?",sub:"성장 단계에 따라 필요한 영양이 달라요",badge:"STEP 1 · 연령",cols:1,
   opts:[{v:"puppy",i:"🐣",l:"퍼피",hint:"생후 ~ 1년"},{v:"adult",i:"🐕",l:"어덜트",hint:"1세 ~ 7세"},{v:"senior",i:"🦴",l:"시니어",hint:"7세 이상"}]},
  {k:"size",q:"아이의 체급을 알려주세요",sub:"알갱이 크기와 칼로리 설계가 달라요",badge:"STEP 2 · 체급",cols:2,
   opts:[{v:"small",i:"🤏",l:"소형견",hint:"10kg 미만"},{v:"medium",i:"🐾",l:"중·대형견",hint:"10kg 이상"}]},
  {k:"health",q:"가장 신경 쓰이는 건강 관리는?",sub:"해당하는 항목을 하나 골라주세요",badge:"STEP 3 · 건강관리",cols:2,
   opts:[{v:"general",i:"💪",l:"일반 건강",hint:"전반적인 영양 관리"},{v:"weight",i:"⚖️",l:"체중 관리",hint:"다이어트·비만 예방"},{v:"skin",i:"✨",l:"피부·피모",hint:"털 윤기·피부 트러블"},{v:"tear",i:"💧",l:"눈물 자국",hint:"눈물 자국 개선"},{v:"joint",i:"🦵",l:"관절",hint:"슬개골·관절 건강"},{v:"digest",i:"🫁",l:"소화·장",hint:"소화 불량·예민한 장"}]},
  {k:"diet",q:"특별히 피하거나 선호하는 원료?",sub:"알러지나 식이 제한이 있으면 알려주세요",badge:"STEP 4 · 원료·식이",cols:2,
   opts:[{v:"none",i:"🍽️",l:"상관없음",hint:"특별한 제한 없음"},{v:"allergy",i:"🚫",l:"알러지·민감성",hint:"단일 원료 처방식 계열"},{v:"chickenFree",i:"🐔",l:"치킨 프리",hint:"닭고기 원료 제외"},{v:"grainFree",i:"🌾",l:"그레인프리",hint:"곡물 무첨가"},{v:"fishFocus",i:"🐟",l:"생선 중심",hint:"생선 단백질 선호"},{v:"rareProtein",i:"🦌",l:"희소 단백질",hint:"사슴·곤충 등"}]},
  {k:"trait",q:"아이의 급여 성향은?",sub:"생활 습관을 알려주시면 더 정확하게 추천해드려요",badge:"STEP 5 · 급여 성향",cols:2,
   opts:[{v:"none",i:"😊",l:"무난함",hint:"특별한 특성 없음"},{v:"picky",i:"😤",l:"입맛 까다로움",hint:"기호성 높은 사료 필요"},{v:"active",i:"🏃",l:"활동량 많음",hint:"에너지 소모가 많은 아이"},{v:"highProtein",i:"💥",l:"고단백·고열량",hint:"근육량 유지·체력 보강"}]}
];

var HL={general:"일반 건강",weight:"체중 관리",skin:"피부·피모",tear:"눈물 자국",joint:"관절",digest:"소화·장",allergy:"알러지·민감성"};
var DL={allergy:"알러지·민감성",chickenFree:"치킨 프리",grainFree:"그레인프리",fishFocus:"생선 중심",rareProtein:"희소 단백질",none:"제한 없음"};
var TL={picky:"입맛 까다로움",active:"활동량 많음",highProtein:"고단백·고열량",none:"무난함"};
var AL={puppy:"퍼피",adult:"어덜트",senior:"시니어"};
var SL={small:"소형견",medium:"중·대형견"};

var step=0, sel={};
var pf=document.getElementById("pf"),
    sl=document.getElementById("sl"),
    sc=document.getElementById("sc"),
    dt=document.getElementById("dots"),
    mc=document.getElementById("mc"),
    sn=document.getElementById("sn"),
    backBtn=document.getElementById("backBtn"),
    navInfo=document.getElementById("navInfo");

function initDots(){
  dt.innerHTML="";
  for(var i=0;i<STEPS.length;i++){
    var d=document.createElement("div");
    d.className="dot"; d.id="d"+i; dt.appendChild(d);
  }
}

function upProg(){
  if(step>=STEPS.length){
    pf.style.width="100%"; sl.textContent="완료!"; sc.textContent="5 / 5";
    for(var i=0;i<STEPS.length;i++) document.getElementById("d"+i).className="dot done";
    backBtn.disabled=false;
    navInfo.textContent="결과 화면";
    return;
  }
  pf.style.width=((step/STEPS.length)*100)+"%";
  sl.textContent=STEPS[step].badge; sc.textContent=(step+1)+" / "+STEPS.length;
  for(var i=0;i<STEPS.length;i++){
    var e=document.getElementById("d"+i);
    if(i<step) e.className="dot done";
    else if(i===step) e.className="dot active";
    else e.className="dot";
  }
  backBtn.disabled=(step===0);
  navInfo.textContent=(step>0) ? STEPS[step-1].badge+" 완료" : "";
}

function renderQ(){
  var s=STEPS[step]; upProg();
  var gc=s.cols===2?"og tc":"og";
  var opts=s.opts.map(function(o){
    return '<button class="ob" id="o'+o.v+'" onclick="pick(\''+s.k+'\',\''+o.v+'\')">'
      +'<span class="oi">'+o.i+'</span>'
      +'<span class="ot"><span class="ol">'+o.l+'</span><span class="oh">'+o.hint+'</span></span>'
      +(s.cols===1?'<span class="oa">&#8250;</span>':'')
      +'</button>';
  }).join("");
  mc.innerHTML='<div class="sf"><div class="qh"><div class="qb">'+s.badge+'</div><div class="qt">'+s.q+'</div><div class="qs">'+s.sub+'</div></div><div class="'+gc+'">'+opts+'</div></div>';
}

function pick(k,v){
  sel[k]=v;
  var btn=document.getElementById("o"+v);
  if(btn){ btn.classList.add("selected"); }
  setTimeout(function(){ step++; if(step>=STEPS.length) showRes(); else renderQ(); },200);
}

function goBack(){
  if(step>0){
    step--;
    delete sel[STEPS[step].k];
    renderQ();
  } else if(step===0 && Object.keys(sel).length===0){
    /* 결과화면에서 뒤로 */
  } else {
    step=STEPS.length-1;
    delete sel[STEPS[step].k];
    sn.style.display="";
    renderQ();
  }
}

function calcRes(){
  var c=P.filter(function(p){ return p.a.indexOf(sel.age)>=0 && p.s.indexOf(sel.size)>=0; });
  c.forEach(function(p){
    p._sc=0;
    if(p.h.indexOf(sel.health)>=0) p._sc+=4;
    if(sel.diet!=="none" && p.d.indexOf(sel.diet)>=0) p._sc+=3;
    if(sel.trait!=="none" && p.t.indexOf(sel.trait)>=0) p._sc+=2;
  });
  c.sort(function(a,b){ return b._sc-a._sc; });
  return c.slice(0,3);
}

function showRes(){
  upProg(); sn.style.display="none";
  var res=calcRes();
  var tags=[AL[sel.age],SL[sel.size],HL[sel.health],
    sel.diet!=="none"?DL[sel.diet]:null,
    sel.trait!=="none"?TL[sel.trait]:null].filter(Boolean);
  var tHTML=tags.map(function(t){ return '<span class="rtag">'+t+'</span>'; }).join("");
  var cards="";
  if(!res.length||res[0]._sc===0){
    cards='<div class="nr"><span class="nre">🤔</span><p>조건에 정확히 맞는 사료가 없습니다.<br/><strong>매장 매니저</strong>에게 문의하시면 더 다양한 옵션을 안내해 드립니다!</p></div>';
  } else {
    var ri=["🥇","🥈","🥉"];
    cards='<div class="pl2">'+res.map(function(p,i){
      var bg="";
      p.a.forEach(function(x){ bg+='<span class="badge ba">'+(AL[x]||x)+'</span>'; });
      p.s.forEach(function(x){ bg+='<span class="badge bs">'+(SL[x]||x)+'</span>'; });
      p.h.forEach(function(x){ bg+='<span class="badge bh">'+(HL[x]||x)+'</span>'; });
      p.d.forEach(function(x){ bg+='<span class="badge bd">'+(DL[x]||x)+'</span>'; });
      p.t.forEach(function(x){ bg+='<span class="badge bt">'+(TL[x]||x)+'</span>'; });
      return '<div class="pc"><div class="prk">'+ri[i]+'</div><div class="pb">'+p.b+'</div><div class="pn">'+p.n+'</div><div class="pbg">'+bg+'</div><div class="pdesc">'+p.c+'</div></div>';
    }).join("")+'</div>';
  }
  mc.innerHTML='<div class="sf"><div class="rh"><span class="rem">✨</span><div class="rt">딱 맞는 사료를 찾았어요!</div><div class="rs">아래 추천 사료를 매장에서 확인해 보세요</div><div class="rtg">'+tHTML+'</div></div>'+cards+'<div class="acts"><button class="rbtn" onclick="restart()">🔄 다시 테스트하기</button></div></div>';
}

function restart(){
  step=0; sel={}; sn.style.display=""; renderQ();
}

initDots(); renderQ();
</script>
