  {n:"닥터 독 양고기 생식",b:"닥터",a:["adult"],s:["small","medium"],h:["general","joint"],d:["grainFree"],t:["picky","active","highProtein"],c:"양고기의 기호성과 관절 건강 지원 성분을 함께 담은 그레인프리 고단백 생식 사료입니다."},
  {n:"닥터 독 사슴육 생식",b:"닥터",a:["adult"],s:["small","medium"],h:["joint"],d:["allergy","chickenFree","grainFree","rareProtein"],t:["picky","active","highProtein"],c:"희소 단백질인 사슴육을 활용한 알러지 친화적 레시피입니다. 그레인프리이며 관절 건강 지원 성분도 함유합니다."},
  {n:"닥터 독 연어육 생식",b:"닥터",a:["adult"],s:["small","medium"],h:["general","joint"],d:["chickenFree","grainFree"],t:["picky","active","highProtein"],c:"연어 단백질로 오메가 지방산이 풍부하고 관절 건강을 지원하는 그레인프리 고단백 레시피입니다."},
  {n:"닥터 독 양+사슴 생식",b:"닥터",a:["adult"],s:["small","medium"],h:["general","joint"],d:["allergy","chickenFree","grainFree"],t:["picky","active","highProtein"],c:"양고기와 사슴 혼합 생식 사료입니다. 풍부한 기호성과 관절 건강 케어를 동시에 원하는 아이에게 추천합니다."},
  {n:"하림 그레인프리 크런치 어덜트",b:"하림",a:["adult","senior"],s:["small","medium"],h:["general"],d:["allergy","grainFree","fishFocus"],t:["picky"],c:"명태크런치와 연어 원료의 그레인프리 사료입니다. 닭고기·양고기·돼지고기 원료가 없어 알러지 아이에게도 적합합니다."},
  {n:"하림 시배드후크",b:"하림",a:["adult"],s:["small","medium"],h:["general"],d:["fishFocus"],t:["picky"],c:"생선 단백질 중심의 부드러운 사료로 알러지 아이도 즐길 수 있습니다."},
  {n:"하림 시배드후크 퍼피",b:"하림",a:["puppy"],s:["small","medium"],h:["general"],d:["fishFocus"],t:["picky"],c:"어린 강아지를 위한 생선 중심 레시피입니다. 처음부터 생선 사료에 익숙해지기 좋습니다."},
  {n:"하림 라이브 DOG 피모",b:"하림",a:["adult"],s:["small","medium"],h:["skin"],d:[],t:[],c:"피부·피모를 집중 관리하는 기능성 사료입니다."},
  {n:"하림 라이브 DOG 알뜰 체중",b:"하림",a:["adult"],s:["small","medium"],h:["weight"],d:[],t:[],c:"체중 조절이 필요한 성인견을 위한 다이어트 사료입니다."},
  {n:"하림 라이브 DOG 쿵쿵관절",b:"하림",a:["adult"],s:["small","medium"],h:["joint"],d:[],t:["active"],c:"관절 건강 지원에 특화된 사료입니다. 활동량이 많은 아이의 관절 보호에 도움을 줍니다."},
  {n:"뉴트리독 DOG HA",b:"뉴트리독",a:["adult"],s:["small","medium"],h:["digest"],d:["allergy"],t:[],c:"알러지·소화 문제로 고민인 아이에게 추천하는 가수분해 단백질 사료입니다. 소화 부담을 줄이고 알러지 반응 개선에 도움을 줍니다."},
  {n:"화이트랩 라이트",b:"화이트랩",a:["adult","senior"],s:["small","medium"],h:["skin","tear","digest"],d:["allergy","grainFree","fishFocus"],t:["picky"],c:"눈물 자국, 피부·피모, 소화 개선에 특화된 그레인프리 생선 중심 사료입니다. 눈물 자국이 심하거나 피부 트러블이 있는 아이에게 추천합니다."},
  {n:"기타 특수상품",b:"기타",a:["adult"],s:["small","medium"],h:[],d:[],t:["picky"],c:"입맛 까다롭거나 다양한 단백질 순환을 원하는 아이에게 추천드리는 특수 상품입니다. 매장 매니저와 상담해 주세요."}
];
const STEPS=[
  {k:"age",q:"아이의 연령대는?",sub:"성장 단계에 따라 필요한 영양이 달라요",badge:"STEP 1 · 연령",cols:1,
   opts:[{v:"puppy",i:"🐣",l:"퍼피",hint:"생후 ~ 1년 (소형견 기준)"},{v:"adult",i:"🐕",l:"어덜트",hint:"1세 ~ 7세"},{v:"senior",i:"🦴",l:"시니어",hint:"7세 이상"}]},
  {k:"size",q:"아이의 체급을 알려주세요",sub:"알갱이 크기와 칼로리 설계가 달라요",badge:"STEP 2 · 체급",cols:2,
   opts:[{v:"small",i:"🤏",l:"소형견",hint:"10kg 미만"},{v:"medium",i:"🐾",l:"중·대형견",hint:"10kg 이상"}]},
  {k:"health",q:"가장 신경 쓰이는 건강 관리는?",sub:"해당하는 항목을 하나 골라주세요",badge:"STEP 3 · 건강관리",cols:2,
   opts:[{v:"general",i:"💪",l:"일반 건강",hint:"전반적인 영양 관리"},{v:"weight",i:"⚖️",l:"체중 관리",hint:"다이어트·비만 예방"},{v:"skin",i:"✨",l:"피부·피모",hint:"털 윤기·피부 트러블"},{v:"tear",i:"💧",l:"눈물 자국",hint:"눈물 자국 개선"},{v:"joint",i:"🦵",l:"관절",hint:"슬개골·관절 건강"},{v:"digest",i:"🫁",l:"소화·장",hint:"소화 불량·예민한 장"}]},
  {k:"diet",q:"특별히 피하거나 선호하는 원료?",sub:"알러지나 식이 제한이 있으면 알려주세요",badge:"STEP 4 · 원료·식이",cols:2,
   opts:[{v:"none",i:"🍽️",l:"상관없음",hint:"특별한 제한 없음"},{v:"allergy",i:"🚫",l:"알러지·민감성",hint:"단일 원료 처방식 계열"},{v:"chickenFree",i:"🐔",l:"치킨 프리",hint:"닭고기 원료 제외"},{v:"grainFree",i:"🌾",l:"그레인프리",hint:"곡물 무첨가"},{v:"fishFocus",i:"🐟",l:"생선 중심",hint:"생선 단백질 선호"},{v:"rareProtein",i:"🦌",l:"희소 단백질",hint:"사슴·캥거루 등"}]},
  {k:"trait",q:"아이의 급여 성향은?",sub:"생활 습관을 알려주시면 더 정확하게 추천해드려요",badge:"STEP 5 · 급여 성향",cols:2,
   opts:[{v:"none",i:"😊",l:"무난함",hint:"특별한 특성 없음"},{v:"picky",i:"😤",l:"입맛 까다로움",hint:"기호성 높은 사료 필요"},{v:"active",i:"🏃",l:"활동량 많음",hint:"에너지 소모가 많은 아이"},{v:"highProtein",i:"💥",l:"고단백·고열량",hint:"근육량 유지·체력 보강"}]}
];
const HL={general:"일반 건강",weight:"체중 관리",skin:"피부·피모",tear:"눈물 자국",joint:"관절",digest:"소화·장"};
const DL={allergy:"알러지·민감성",chickenFree:"치킨 프리",grainFree:"그레인프리",fishFocus:"생선 중심",rareProtein:"희소 단백질",none:"제한 없음"};
const TL={picky:"입맛 까다로움",active:"활동량 많음",highProtein:"고단백·고열량",none:"무난함"};
const AL={puppy:"퍼피",adult:"어덜트",senior:"시니어"};
const SL={small:"소형견",medium:"중·대형견"};

let step=0,sel={};
const pf=document.getElementById("pf"),sl=document.getElementById("sl"),sc=document.getElementById("sc"),
      dt=document.getElementById("dots"),mc=document.getElementById("mc"),sn=document.getElementById("sn");

function initDots(){
  dt.innerHTML="";
  for(let i=0;i<STEPS.length;i++){
    const d=document.createElement("div");
    d.className="dot"; d.id="d"+i; dt.appendChild(d);
  }
}
function upProg(){
  if(step>=STEPS.length){
    pf.style.width="100%"; sl.textContent="완료!"; sc.textContent="5 / 5";
    for(let i=0;i<STEPS.length;i++) document.getElementById("d"+i).className="dot done";
    return;
  }
  pf.style.width=((step/STEPS.length)*100)+"%";
  sl.textContent=STEPS[step].badge; sc.textContent=step+" / "+STEPS.length;
  for(let i=0;i<STEPS.length;i++){
    const e=document.getElementById("d"+i);
    if(i<step) e.className="dot done";
    else if(i===step) e.className="dot active";
    else e.className="dot";
  }
}
function renderQ(){
  const s=STEPS[step]; upProg();
  const gc=s.cols===2?"og tc":"og";
  const opts=s.opts.map(o=>`
    <button class="ob" id="o${o.v}" onclick="pick('${s.k}','${o.v}')">
      <span class="oi">${o.i}</span>
      <span class="ot"><span class="ol">${o.l}</span><span class="oh">${o.hint}</span></span>
      ${s.cols===1?"<span class='oa'>›</span>":""}
    </button>`).join("");
  mc.innerHTML=`<div class="sf"><div class="qh"><div class="qb">${s.badge}</div><div class="qt">${s.q}</div><div class="qs">${s.sub}</div></div><div class="${gc}">${opts}</div></div>`;
}
function pick(k,v){
  sel[k]=v;
  const btn=document.getElementById("o"+v);
  if(btn){
    btn.style.background="linear-gradient(135deg,#FF6B2B,#FF4500)";
    btn.style.color="#fff"; btn.style.borderColor="#FF6B2B";
    setTimeout(()=>{ step++; if(step>=STEPS.length) showRes(); else renderQ(); },200);
  }
}
function calcRes(){
  let c=P.filter(p=>p.a.includes(sel.age)&&p.s.includes(sel.size));
  c.forEach(p=>{
    p._sc=0;
    if(p.h.includes(sel.health)) p._sc+=4;
    if(sel.diet!=="none"&&p.d.includes(sel.diet)) p._sc+=3;
    if(sel.trait!=="none"&&p.t.includes(sel.trait)) p._sc+=2;
  });
  c.sort((a,b)=>b._sc-a._sc);
  return c.slice(0,3);
}
function showRes(){
  upProg(); sn.style.display="none";
  const res=calcRes();
  const tags=[AL[sel.age],SL[sel.size],HL[sel.health],
    sel.diet!=="none"?DL[sel.diet]:null,
    sel.trait!=="none"?TL[sel.trait]:null].filter(Boolean);
  const tHTML=tags.map(t=>`<span class="rtag">${t}</span>`).join("");
  let cards="";
  if(!res.length||res[0]._sc===0){
    cards=`<div class="nr"><span class="nre">🤔</span><p>조건에 정확히 맞는 사료가 없습니다.<br/><strong>매장 매니저</strong>에게 문의하시면 더 다양한 옵션을 안내해 드립니다!</p></div>`;
  } else {
    const ri=["🥇","🥈","🥉"],rc=["r1","r2","r3"];
    cards="<div class='pl2'>"+res.map((p,i)=>{
      let bg="";
      p.a.forEach(x=>{bg+=`<span class="badge ba">${AL[x]||x}</span>`;});
      p.s.forEach(x=>{bg+=`<span class="badge bs">${SL[x]||x}</span>`;});
      p.h.forEach(x=>{bg+=`<span class="badge bh">${HL[x]||x}</span>`;});
      p.d.forEach(x=>{bg+=`<span class="badge bd">${DL[x]||x}</span>`;});
      p.t.forEach(x=>{bg+=`<span class="badge bt">${TL[x]||x}</span>`;});
      return `<div class="pc"><div class="prk">${ri[i]}</div><div class="pb">${p.b}</div><div class="pn">${p.n}</div><div class="pbg">${bg}</div><div class="pdesc">${p.c}</div></div>`;
    }).join("")+"</div>";
  }
  mc.innerHTML=`<div class="sf"><div class="rh"><span class="rem">✨</span><div class="rt">딱 맞는 사료를 찾았어요!</div><div class="rs">아래 추천 사료를 매장에서 확인해 보세요</div><div class="rtg">${tHTML}</div></div>${cards}<div class="acts"><button class="rbtn" onclick="restart()">🔄 다시 테스트하기</button></div></div>`;
}
function restart(){
  step=0; sel={}; sn.style.display=""; renderQ();
}
initDots(); renderQ();
</script>
</body>
</html>
